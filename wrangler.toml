name = "nova-grid-site"
compatibility_date = "2024-11-01"

# Cloudflare Pages configuration:
# `pages_build_output_dir` lets `wrangler pages deploy` (run from the repo
# root) upload the built static assets AND the `functions/` directory.
pages_build_output_dir = "dist"

# D1 binding is intentionally NOT declared here. Cloudflare's build pipeline
# resolves wrangler.toml D1 bindings while publishing the Functions worker,
# and an unresolvable id fails the whole deployment. Instead, bind the D1
# database in the Cloudflare Pages dashboard AFTER deployment:
#   Pages project -> Settings -> Bindings -> Add binding -> D1 database
#   Variable name: DB    (must be exactly "DB" - the functions read env.DB)
#   Database: qncms
# Once bound, the functions auto-create the tables on first request
# (see functions/_utils.js ensureTables), so no manual migration is needed.

# Secrets (ADMIN_USERNAME / ADMIN_PASSWORD / ADMIN_PASSWORD_HASH / JWT_SECRET)
# are also configured in the dashboard (Settings -> Environment variables),
# never committed here.
