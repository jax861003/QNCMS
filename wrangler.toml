name = "nova-grid-site"
compatibility_date = "2024-11-01"

# Cloudflare Pages configuration
# Note: pages_build_output_dir is set in the Cloudflare Dashboard UI, not here.
# This file is used by `wrangler pages dev` for local development.

[[d1_databases]]
binding = "DB"
database_name = "nova-site-db"
database_id = "YOUR_D1_DATABASE_ID"

[vars]
ADMIN_USERNAME = "admin"
# Generate hash with: node -e "console.log(require('crypto').createHash('sha256').update('your_password').digest('hex'))"
ADMIN_PASSWORD_HASH = "PLACEHOLDER_CHANGE_ME"
JWT_SECRET = "CHANGE-ME-TO-A-RANDOM-32-CHARS-STRING"
