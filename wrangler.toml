name = "nova-grid-site"
compatibility_date = "2024-11-01"

# Cloudflare Pages configuration
pages = {
  build_command = "npm run build",
  output_directory = "dist",
}

[[d1_databases]]
binding = "DB"
database_name = "nova-site-db"
database_id = "YOUR_D1_DATABASE_ID"

[vars]
ADMIN_USERNAME = "admin"
# Generate hash: node -e "console.log(require('crypto').createHash('sha256').update('your_password').digest('hex'))"
ADMIN_PASSWORD_HASH = "PLACEHOLDER_CHANGE_ME"
JWT_SECRET = "CHANGE-ME-TO-RANDOM-32-CHARS-STRING"
